<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#136B4F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inventario">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
<title>Inventario de Bebidas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: libreta de local. Barra de cuatro pestañas grandes que se queda arriba, cuerpo de una sola columna (máx. 56rem), renglones anchos con la cantidad a la derecha y una barra de totales fija abajo mientras se cuenta o se revisa. */
:root{
  --font-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#EEF3F0;
  --surface:#FFFFFF;
  --surface-2:#F5F8F6;
  --ink:#14231D;
  --ink-2:#4B5F56;
  --line:#CBD8D1;
  --brand:#136B4F;
  --brand-hover:#0E5640;
  --brand-soft:#DDEFE7;
  --on-brand:#FFFFFF;
  --cat-cerveza:#D9930D;
  --cat-soda:#C8412F;
  --cat-agua:#2F80C0;
  --cat-otros:#6B7C74;
  --warn-bg:#FFF4D6;
  --warn-ink:#6E4300;
  --warn-line:#E4BC62;
  --bad-bg:#FDE9E6;
  --bad-ink:#9B2318;
  --bad-line:#E9A79F;
  --focus:#1B66C9;
  --shadow:0 1px 2px rgba(20,35,29,.08),0 8px 22px rgba(20,35,29,.07);
  --shadow-up:0 -6px 18px rgba(20,35,29,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1713;--surface:#16221D;--surface-2:#1B2924;--ink:#E7F1EC;--ink-2:#A3B6AD;--line:#2C3D36;
    --brand:#3FB88B;--brand-hover:#55C99D;--brand-soft:#1C3A30;--on-brand:#06231A;
    --cat-cerveza:#E8A53A;--cat-soda:#E36B5A;--cat-agua:#5BA7E0;--cat-otros:#8FA39A;
    --warn-bg:#3A2F10;--warn-ink:#F2CE7A;--warn-line:#6B5A22;
    --bad-bg:#3A1A16;--bad-ink:#F2A59B;--bad-line:#7A3A32;
    --focus:#8DBBFF;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-up:0 -6px 18px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1713;--surface:#16221D;--surface-2:#1B2924;--ink:#E7F1EC;--ink-2:#A3B6AD;--line:#2C3D36;
  --brand:#3FB88B;--brand-hover:#55C99D;--brand-soft:#1C3A30;--on-brand:#06231A;
  --cat-cerveza:#E8A53A;--cat-soda:#E36B5A;--cat-agua:#5BA7E0;--cat-otros:#8FA39A;
  --warn-bg:#3A2F10;--warn-ink:#F2CE7A;--warn-line:#6B5A22;
  --bad-bg:#3A1A16;--bad-ink:#F2A59B;--bad-line:#7A3A32;
  --focus:#8DBBFF;--shadow:0 1px 2px rgba(0,0,0,.4);--shadow-up:0 -6px 18px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1.125rem/1.5 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:2.5rem}
h2{font-size:1.9rem}
h3{font-size:1.45rem}
p{margin:0}
.wrap{max-width:56rem;margin-inline:auto;padding-inline:16px}
.stamp{font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:1rem}
.muted{color:var(--ink-2)}
.small{font-size:.95rem}
.ic{flex:none}

/* Cabecera y pestañas */
.brandbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.75rem;line-height:1}
@media (max-width:420px){.brand{font-size:1.5rem}.brand svg{width:30px;height:30px}}
.brand svg{color:var(--brand)}
.pill{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:6px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:.98rem;font-weight:700}
.pill .dot{width:11px;height:11px;border-radius:50%;background:var(--brand)}
.pill[data-s="guardando"] .dot{background:var(--cat-cerveza)}
.pill[data-s="error"],.pill[data-s="sin"]{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad-ink)}
.pill[data-s="error"] .dot,.pill[data-s="sin"] .dot{background:var(--bad-ink)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-block:1px solid var(--line)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;min-width:0;padding:4px 2px;border:0;border-radius:12px;background:transparent;color:var(--ink-2);font-size:.95rem;font-weight:700;line-height:1.1}
.tab[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.tab:hover{background:var(--surface-2)}
.tab[aria-current="page"]:hover{background:var(--brand-soft)}
@media (min-width:640px){.tab{flex-direction:row;gap:10px;font-size:1.08rem;min-height:56px}}
main{padding-block:22px 28px;display:flex;flex-direction:column;gap:20px}
main:focus{outline:none}
.splash{min-height:40vh;display:grid;place-items:center;color:var(--ink-2)}

/* Títulos de cada pantalla */
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.vhead .btns{display:flex;flex-wrap:wrap;gap:10px}
.lead{color:var(--ink-2)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 22px;border-radius:14px;border:2px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:700;font-size:1.1rem;line-height:1.2;text-align:center}
.btn:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.sec{background:transparent;color:var(--brand)}
.btn.sec:hover{background:var(--brand-soft)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand);padding-inline:12px}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{background:transparent;border-color:var(--bad-ink);color:var(--bad-ink)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{min-height:48px;padding:8px 16px;font-size:1rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:12px}

/* Tarjetas y avisos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;border:1.5px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-ink)}
.note.bad{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad-ink)}
.note.good{border-color:var(--line);background:var(--brand-soft);color:var(--ink)}
.note .btns{margin-top:10px}
.note > div{min-width:0}
.how{margin:0;padding-left:1.4rem;display:flex;flex-direction:column;gap:8px}

/* Botones grandes de inicio */
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:14px}
.big{display:flex;align-items:center;gap:16px;width:100%;min-height:100px;padding:20px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:left}
.big:hover{border-color:var(--brand)}
.big.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.big.primary:hover{background:var(--brand-hover)}
.big .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.big .t{font-weight:700;font-size:1.25rem;line-height:1.2}
.big .s{font-size:.98rem;opacity:.85}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lab{font-weight:700;font-size:1.02rem}
.help{color:var(--ink-2);font-size:.97rem}
.inp{width:100%;min-width:0;min-height:56px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:1.15rem}
.inp:focus{border-color:var(--brand)}
.inp.err{border-color:var(--bad-ink)}
.inp::placeholder{color:var(--ink-2);opacity:.7}
.errmsg{color:var(--bad-ink);font-weight:700;font-size:1rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:16px}
.money{position:relative}
.money > span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--ink-2);pointer-events:none}
.money .inp{padding-left:30px}
.inline{display:flex;align-items:center;gap:10px}
.inline .inp{max-width:9rem}
textarea.inp{min-height:9rem;resize:vertical;font-size:1rem;font-family:ui-monospace,Menlo,Consolas,monospace}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{min-height:48px;padding:8px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.chip:hover{border-color:var(--brand)}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg .chip{border-radius:14px;min-height:56px;line-height:1.2}
.tools{display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.search .inp{padding-left:46px}

/* Categorías */
.cat{display:inline-flex;align-items:center;gap:9px}
.cat::before{content:"";flex:none;width:13px;height:13px;border-radius:3px;background:var(--c,var(--cat-otros))}
[data-cat="Cerveza"]{--c:var(--cat-cerveza)}
[data-cat="Soda"]{--c:var(--cat-soda)}
[data-cat="Agua"]{--c:var(--cat-agua)}
[data-cat="Otros"]{--c:var(--cat-otros)}

/* Listas tipo libreta */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
#lista{display:flex;flex-direction:column;gap:16px}
.sub-h{padding:9px 16px;background:var(--surface-2);border-block:1px solid var(--line);color:var(--ink-2);font-size:.95rem;font-weight:700}
.sheet-h{padding:12px 18px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:80px}
.row:last-child,.prow:last-child,.rev:last-child{border-bottom:0}
.row.has{background:var(--brand-soft)}
.name{flex:1 1 11rem;min-width:0;display:flex;flex-direction:column}
.name b{font-size:1.17rem;line-height:1.25;overflow-wrap:anywhere}
.name span{color:var(--ink-2);font-size:.98rem}
.name .tag{color:var(--brand);font-weight:700;font-size:.92rem}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;border:2px solid var(--brand);background:var(--surface);color:var(--brand)}
.qty button:active{background:var(--brand-soft)}
.qty input{width:78px;height:52px;padding:0;text-align:center;font-size:1.4rem;font-weight:700;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.qty input:focus{border-color:var(--brand)}
.qtys{display:flex;flex-wrap:wrap;gap:8px 14px;flex:0 0 auto}
.qtys .qty button{width:46px;height:50px}
.qtys .qty input{width:64px;height:50px;font-size:1.3rem}
.fld .k{white-space:nowrap}
@media (max-width:620px){.qtys{flex:1 1 100%}}
@media (max-width:420px){.qtys{gap:8px 10px}.qtys .qty button{width:42px}.qtys .qty input{width:58px}}
@media (max-width:420px){.qty button{width:46px}.qty input{width:62px}.row{padding-inline:12px}}

.prow{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.ptop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.pgrid{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:12px}

.rev{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.rev-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.rev-top b{font-size:1.2rem;overflow-wrap:anywhere}
.rev-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:12px 14px}
.cell{display:flex;flex-direction:column;gap:4px;min-width:0}
.cell .k{font-size:.95rem;color:var(--ink-2);font-weight:700}
.cell .v{font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.cell .sub{font-size:.92rem;color:var(--ink-2);min-height:1.3em}
.cell.wide{grid-column:1/-1}
@media (min-width:640px){.cell.wide{grid-column:span 2}}
.duo{display:flex;gap:10px}
.mini{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.mini label{font-size:.92rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.mini .inp{text-align:center;padding-inline:6px}
.mini .money .inp{text-align:left;padding-left:28px;padding-right:8px}
.cell .sub.hint{margin-top:2px}
.pform{display:flex;flex-direction:column;gap:16px}
.pform.flat{padding:4px 0}

/* Pasos del inventario */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.step{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:0;min-height:76px;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:700;line-height:1.15;text-align:center}
.step .n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);font-family:var(--font-display);font-size:1.3rem;line-height:1}
.step[aria-current="step"]{border-color:var(--brand);background:var(--brand-soft)}
.step[aria-current="step"] .n{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
@media (min-width:640px){.step{flex-direction:row;gap:12px}}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-weight:700;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface-2)}
.badge.ok{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.badge.prog{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.invhead{display:flex;flex-direction:column;gap:12px}
.invhead .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}

/* Barra de totales fija abajo */
.bar{position:sticky;bottom:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-inline:-16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:3px solid var(--brand);box-shadow:var(--shadow-up)}
.barinfo{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:1.05rem}
.barinfo b{font-variant-numeric:tabular-nums}

/* Resultados */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.tile .k{color:var(--ink-2);font-size:.95rem}
.tile .n{font-family:var(--font-display);font-weight:700;font-size:2.5rem;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .sub{font-size:.92rem;color:var(--ink-2)}
.tile.main{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
@media (max-width:420px){.tile .n{font-size:2rem}.tile{padding:12px 14px}}
.tile.main .k,.tile.main .sub{color:inherit;opacity:.92}
.bars{display:grid;grid-template-columns:auto minmax(4rem,1fr) auto;align-items:center;gap:12px 12px}
.bar-row{display:contents}
.track{height:20px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fill{height:100%;background:var(--c,var(--cat-otros));border-radius:10px}
.bar-row .amt{font-weight:700;font-variant-numeric:tabular-nums;min-width:5.5rem;text-align:right}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:1.05rem}
.tbl th{text-align:right;font-size:.95rem;color:var(--ink-2);padding:10px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl td:first-child{overflow-wrap:anywhere}
.tbl td small{display:block;color:var(--ink-2);font-size:.9rem}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li span:last-child{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.list .bd{display:block;font-weight:400;font-size:.92rem;color:var(--ink-2)}

/* Inventarios guardados */
.inv-card{gap:10px}
.inv-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.inv-list{display:flex;flex-direction:column;gap:16px}

/* Marcas comunes */
.pickrow{display:flex;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line);background:var(--surface)}
.pickrow:last-child{border-bottom:0}
.pickrow[data-on="true"]{background:var(--brand-soft)}
.pick{flex:1 1 15rem;display:flex;align-items:center;gap:14px;min-width:0;min-height:68px;padding:10px 16px;border:0;background:transparent;text-align:left}
.pick .box{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:9px;border:2.5px solid var(--ink-2);color:transparent}
.pickrow[data-on="true"] .box{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pickrow.owned .pick{cursor:default}
.pickrow.owned .box{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.pickx{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px;flex:1 1 100%;padding:0 16px 14px}
@media (min-width:760px){.pickx{flex:0 0 auto;margin-left:auto;padding:0 16px}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld .k{font-size:.92rem;font-weight:700;color:var(--ink-2)}
.pickx .money{width:8rem}
.pickx .money .inp{min-height:48px;padding-block:6px}
.sheet-h.flexh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}

/* Marcas con varias presentaciones */
.bgroup{border-bottom:1px solid var(--line)}
.bgroup:last-child{border-bottom:0}
.brand-h{padding:12px 16px 2px;font-weight:700;font-size:1.17rem;line-height:1.25;overflow-wrap:anywhere}
.bgroup .row{min-height:68px;padding-top:8px;padding-bottom:10px}
.bgroup .row:last-child,.bgroup .rev:last-child,.bgroup .prow:last-child{border-bottom:0}
.bgroup .row .name,.bgroup .pick .name,.bgroup .prow .name,.bgroup .rev-top{padding-left:12px;border-left:3px solid var(--line)}
.bgroup .name b,.bgroup .rev-top b{font-size:1.08rem}
.row + .sub-h,.bgroup + .sub-h{border-top:0}
.sub-note{font-size:.92rem;color:var(--ink-2)}

/* Enviar resultados */

/* ----- Paso 2: revisar ventas ----- */
function revOut(inv, it) {
  var c = calcItem(it), esV = inv.modo === 'vendidas';
  var otro = esV ? c.quedan : c.v;
  var bd = esV ? breakdown(c.quedan, c.pc) : (c.pc > 0 && c.vc > 0 ? splitText(c.vc, c.vs) : '');
  var hint = (c.pc > 0 && c.pCaja === null && c.precio !== null) ? 'Vacío: se cobra ' + money(c.cajaP) + ' (' + c.pc + ' × ' + money(c.precio) + ')' : '';
  return { otro: otro, bd: bd, total: money(c.ingreso), totbd: ingresoDetalle(c), falta: c.falta, hint: hint, cajaPh: c.cajaP === null ? '0.00' : c.cajaP.toFixed(2) };
}
function rowRev(inv, it, grouped) {
  var c = calcItem(it), esV = inv.modo === 'vendidas', o = revOut(inv, it), pc = c.pc;

  var cv = !c.rev ? '' : (a > 0 ? String(a) : ''), sv = !c.rev ? '' : ((b === 0 && a > 0) ? '' : String(b));
  var hab = breakdown(c.ini, pc), pid = it.pid;
  var mini = function (id, label, u, val) {
    return '<div class="mini"><label for="' + id + '">' + label + '</label><input id="' + id + '" class="inp" type="text" inputmode="numeric" data-f="rev" data-u="' + u + '" data-pid="' + pid + '" value="' + val + '" placeholder="0" autocomplete="off"></div>';
  };
  var money1 = function (id, label, f, val, ph) {
    return '<div class="mini"><label for="' + id + '">' + label + '</label><div class="money"><span>$</span><input id="' + id + '" class="inp" type="text" inputmode="decimal" data-f="' + f + '" data-pid="' + pid + '" value="' + fmtIn(val) + '" placeholder="' + ph + '" autocomplete="off"></div></div>';
  };
  var inputs = pc > 0
    ? mini('vc-' + pid, 'Cajas (de ' + pc + ')', 'c', cv) + mini('vs-' + pid, 'Sueltas', 's', sv)
    : mini('vs-' + pid, unidLabel(it.nombre + ' ' + it.presentacion), 's', sv);
  var precios = pc > 0
    ? money1('pcj-' + pid, 'Precio de 1 caja', 'precioc', it.precioCaja, o.cajaPh) + money1('p-' + pid, 'Precio individual', 'precio', it.precio, '0.00')

  return '<div class="rev" data-pid="' + pid + '"><div class="rev-top">' + (grouped ? '<b>' + esc(it.presentacion || it.nombre) + '</b>' : '<b>' + esc(it.nombre) + '</b><span class="muted">' + esc(it.presentacion) + '</span>') + '</div>' +
    '<div class="rev-grid">' +
    '<div class="cell"><span class="k">Había</span><span class="v">' + c.ini + '</span><span class="sub">' + (hab || '&nbsp;') + '</span></div>' +
    '<div class="cell"><span class="k">' + (esV ? 'Quedan' : 'Se vendieron') + '</span><span class="v" data-out="otro">' + o.otro + '</span><span class="sub" data-out="otrobd">' + (o.bd || '&nbsp;') + '</span></div>' +
    '<div class="cell wide"><span class="k">Dinero vendido</span><span class="v" data-out="total">' + o.total + '</span><span class="sub" data-out="totbd">' + (o.totbd || '&nbsp;') + '</span></div></div>' +
    '<div class="rev-grid">' +
    '<div class="cell wide"><span class="k">' + (esV ? 'Se vendieron' : 'Quedan ahora') + '</span><div class="duo">' + inputs + '</div></div>' +
    '<div class="cell wide"><span class="k">Precio de venta</span><div class="duo">' + precios + '</div>' + (pc > 0 ? '<span class="sub hint" data-out="cajahint">' + (o.hint || '&nbsp;') + '</span>' : '') + '</div></div>' +
    '<p class="errmsg" data-out="aviso" hidden></p><p class="help" data-out="falta"' + (o.falta ? '' : ' hidden') + '>' + (pc > 0 ? 'Escribe el precio de la caja o el individual para calcular el dinero de este producto.' : 'Escribe el precio para calcular el dinero de este producto.') + '</p></div>';
}
function barRevision(inv) {

  } else if (f === 'precio' || f === 'precioc') {
    inv = curInv(); if (!inv) return;
    syncPrecio(pid, f === 'precio' ? 'precio' : 'precioCaja', parseMoney(el.value)); patchRev(pid); refreshBar();
  } else if (f === 'pporcaja') {
    el.value = el.value.replace(/\D/g, '').slice(0, 4);
    var pp = getProd(pid);
    if (pp && el.value !== '') { pp.porCaja = num(el.value); syncProducto(pp); touchProductos(); paintProdRow(el.closest('.prow'), pp.porCaja); }
  } else if (f === 'pprecio' || f === 'pprecioc' || f === 'pcosto') {
    var p = getProd(pid); if (!p) return;
    var v = parseMoney(el.value);
    if (f === 'pprecio') p.precio = v; else if (f === 'pprecioc') p.precioCaja = v; else p.costo = v;
    syncProducto(p); touchProductos();
    var fp = $('#falta-precios'); if (fp) fp.innerHTML = faltaPreciosHTML();
  } else if (f === 'dias') {
    el.value = el.value.replace(/\D/g, '').slice(0, 4);
    inv = curInv(); if (!inv || el.value === '') return;
    inv.fin = addDays(inv.inicio, parseInt(el.value, 10)); touchInv(inv); patchFechas(inv);
  } else if (f === 'nf') {
    ui.nf[el.dataset.k] = el.value;
    if (el.dataset.k === 'inicio' || el.dataset.k === 'fin') { var h = $('#hint-dias'); if (h) h.textContent = hintDias(); }
  } else if (f === 'pf') {
    var k = el.dataset.k;
    if (k === 'cajas' || k === 'sueltas' || k === 'porCaja') el.value = el.value.replace(/\D/g, '').slice(0, 6);
    ui.pf[k] = el.value;
    if (k === 'nombre' || k === 'presentacion') autoCaja();
    if (k === 'presentacion') paintPres();
    var ptt = $('#pf-tot'); if (ptt) ptt.textContent = pfTotText();
  } else if (f === 'bibprecio') {
    if (ui.bib[el.dataset.i]) ui.bib[el.dataset.i].precio = el.value;
  } else if (f === 'q') {
    ui.q = el.value; applyFilter();
  } else if (f === 'restore') {
    ui.restoreText = el.value;
  }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.f === 'file' && el.files && el.files[0]) {
    var fr = new FileReader();
    fr.onload = function () { ui.restoreText = String(fr.result || ''); prepararRestauracion(); render(); };
    fr.onerror = function () { ui.restoreMsg = 'No se pudo leer el archivo.'; render(); };
    fr.readAsText(el.files[0]);
  }
});
function syncForm(form) {
  $$('[data-f="nf"],[data-f="pf"]', form).forEach(function (el) {
    var tgt = el.dataset.f === 'nf' ? ui.nf : ui.pf;
    if (tgt && el.dataset.k) tgt[el.dataset.k] = el.value;
  });
}
document.addEventListener('submit', function (e) {
  var form = e.target.closest ? e.target.closest('[data-form]') : null; if (!form) return;
  e.preventDefault();
  syncForm(form);
  var kind = form.dataset.form;
  if (kind === 'nuevo') {
    var er = validarInventario(ui.nf); ui.errs = er;
    if (Object.keys(er).length) { render(); var first = er.nombre ? 'nf-nombre' : er.inicio ? 'nf-inicio' : 'nf-fin'; focusId(first); return; }
    var inv = crearInventario(ui.nf);
    ui.invId = inv.id; ui.step = 1; ui.errs = {};
    toast('Inventario creado. Ahora escribe las cantidades.'); go('inv');
  } else if (kind === 'info') {
    var er2 = validarInventario(ui.nf); ui.errs = er2;
    if (Object.keys(er2).length) { render(); focusId(er2.nombre ? 'nf-nombre' : er2.inicio ? 'nf-inicio' : 'nf-fin'); return; }
    var cur = curInv(); if (!cur) return;
    cur.nombre = ui.nf.nombre.trim(); cur.inicio = ui.nf.inicio; cur.fin = ui.nf.fin; touchInv(cur);
    ui.editInfo = false; ui.errs = {}; toast('Cambios guardados'); render();
  } else if (kind === 'prod') {
    saveProd();
  }
});
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { if (anyDirty()) flush(); else writeLocal(); } });
window.addEventListener('pagehide', function () { writeLocal(); });

/* ================= Arranque ================= */
$('#logo').innerHTML = capSVG(36);
paintChrome();
(async function () {
  await initStorage();
  render();
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      downloads = await withTimeout(window.claude.use('downloads'), 3000).catch(function () { return null; });
      canDownload = !!(downloads && typeof downloads.save === 'function');
      if (canDownload && (ui.view === 'respaldo' || (ui.view === 'inv' && ui.step === 3))) render();
    }
  } catch (e) { canDownload = false; }
})();
})();
</script>
